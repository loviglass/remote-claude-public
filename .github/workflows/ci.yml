name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Test Go packages
        run: go test -race ./...
      - name: Vet Go packages
        run: go vet ./...

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test Python helpers
        run: python3 -m unittest discover -s scripts -p 'test_*.py'
      - name: Compile Python helpers
        run: python3 -m compileall -q scripts
      - name: Check administrator CLIs
        run: |
          python3 scripts/add-account.py --help >/dev/null
          python3 scripts/new-invitation.py --help >/dev/null
          python3 scripts/install-server.py --help >/dev/null
          python3 scripts/build-release.py --help >/dev/null
          python3 scripts/check-release.py --help >/dev/null

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan Git history for credentials
        run: |
          docker run --rm -v "$GITHUB_WORKSPACE:/repo:ro" \
            zricethezav/gitleaks:v8.30.0 detect --source=/repo \
            --log-opts=--all --redact --exit-code=1
